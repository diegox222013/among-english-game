<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Among Us - English Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 12px;
      transition: background-color 0.5s;
    }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 480px;
      margin-bottom: 15px;
      text-align: center;
    }
    input, button {
      padding: 14px 18px;
      margin: 6px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      width: 100%;
    }
    input { background: #0f172a; color: white; border: 1px solid #334155; }
    button { background-color: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
    .sabotage-btn { background-color: #a855f7; margin-top: 10px; }
    .emergency-btn { background-color: #ef4444; margin-top: 10px; }
    .vote-btn { background-color: #f59e0b; margin: 4px 0; }
    .hidden { display: none; }
    .role-badge { font-size: 18px; font-weight: bold; padding: 4px 8px; border-radius: 5px; }
    .impostor { color: #f87171; }
    .crewmate { color: #60a5fa; }
    .opt-btn { background: #334155; color: white; text-align: left; }
    
    /* MODO SABOTAJE (Oscurecimiento) */
    body.dark-mode { background-color: #020617; }
    .dark-card { background: #020617 !important; border: 2px solid #ef4444; }
  </style>
</head>
<body>

  <h1>🚀 Among Us: English Quest</h1>

  <!-- LOBBY -->
  <div id="lobby-screen" class="card">
    <h2>Join Room</h2>
    <input type="text" id="username" placeholder="Enter Nickname">
    <button onclick="joinGame()">Join Game</button>
    
    <h3>Players in Lobby:</h3>
    <ul id="player-list" style="list-style: none; padding: 0;"></ul>
    <button id="start-btn" onclick="startGame()" style="display:none; background-color: #22c55e;">Start Game 🚀</button>
  </div>

  <!-- TASKS / GAMEPLAY -->
  <div id="game-screen" class="card hidden">
    <div>Your Role: <span id="role-display" class="role-badge"></span></div>
    <hr style="border-color: #334155; margin: 12px 0;">

    <div id="task-box">
      <h3 id="task-question">Loading task...</h3>
      <div id="task-options"></div>
      <div id="feedback" style="font-weight: bold; margin-top: 10px;"></div>
    </div>

    <!-- BOTÓN EXCLUSIVO DEL IMPOSTOR -->
    <button id="sabotage-btn" class="sabotage-btn hidden" onclick="triggerSabotage()">⚡ Sabotage Lights</button>
    <button class="emergency-btn" onclick="triggerEmergency()">🚨 Emergency Meeting</button>
  </div>

  <!-- DISCUSSION & VOTING -->
  <div id="discussion-screen" class="card hidden">
    <h2 style="color: #ef4444;">🚨 EMERGENCY MEETING 🚨</h2>
    <p>Who is acting suspicious? Vote out the suspect!</p>
    <div id="voting-list"></div>
    <div id="vote-status" style="margin-top: 10px; color: #94a3b8;"></div>
  </div>

  <!-- EJECTION RESULT -->
  <div id="eject-screen" class="card hidden">
    <div id="eject-text" style="font-size: 22px; font-weight: bold; padding: 20px;"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentQuestionObj = null;
    let myRole = '';

    function joinGame() {
      const name = document.getElementById('username').value.trim();
      if (name) {
        socket.emit('joinGame', name);
        document.getElementById('start-btn').style.display = 'block';
      }
    }

    function startGame() { socket.emit('startGame'); }
    function triggerEmergency() { socket.emit('callEmergency'); }
    function triggerSabotage() { socket.emit('triggerSabotage'); }

    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      Object.values(players).forEach(p => {
        const li = document.createElement('li');
        li.textContent = `👨‍🚀 ${p.name}`;
        list.appendChild(li);
      });
    });

    socket.on('gameStarted', (data) => {
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('discussion-screen').classList.add('hidden');
      document.getElementById('eject-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      const me = data.players[socket.id];
      myRole = me.role;
      const roleElem = document.getElementById('role-display');
      roleElem.textContent = myRole;
      roleElem.className = `role-badge ${myRole.toLowerCase()}`;

      // Mostrar botón de sabotaje solo al impostor
      if (myRole === 'IMPOSTOR') {
        document.getElementById('sabotage-btn').classList.remove('hidden');
      }

      loadTask(data.question);
    });

    function loadTask(q) {
      currentQuestionObj = q;
      document.getElementById('task-question').textContent = q.question;
      const optContainer = document.getElementById('task-options');
      optContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          socket.emit('submitAnswer', { questionText: currentQuestionObj.question, answerIndex: idx });
        };
        optContainer.appendChild(btn);
      });
    }

    socket.on('taskResult', (data) => {
      const feedback = document.getElementById('feedback');
      feedback.style.color = data.correct ? '#4ade80' : '#f87171';
      feedback.textContent = data.correct ? '✅ Correct task!' : '❌ Wrong answer!';
      setTimeout(() => {
        feedback.textContent = '';
        loadTask(data.nextQuestion);
      }, 500);
    });

    // ACTIVACIÓN DE SABOTAJE
    socket.on('sabotageTriggered', (data) => {
      document.body.classList.add('dark-mode');
      document.getElementById('game-screen').classList.add('dark-card');
      loadTask(data.question);
    });

    // REPARACIÓN DE SABOTAJE
    socket.on('sabotageFixed', () => {
      document.body.classList.remove('dark-mode');
      document.getElementById('game-screen').classList.remove('dark-card');
      alert('⚡ Lights fixed!');
    });

    socket.on('startDiscussion', (players) => {
      document.body.classList.remove('dark-mode');
      document.getElementById('game-screen').classList.remove('dark-card');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('discussion-screen').classList.remove('hidden');

      const container = document.getElementById('voting-list');
      container.innerHTML = '';

      Object.values(players).forEach(p => {
        if (p.isAlive) {
          const btn = document.createElement('button');
          btn.className = 'vote-btn';
          btn.textContent = `Vote ${p.name}`;
          btn.onclick = () => {
            socket.emit('castVote', p.id);
            container.innerHTML = '<p>Vote registered! Waiting for others...</p>';
          };
          container.appendChild(btn);
        }
      });
    });

    socket.on('voteUpdate', (data) => {
      document.getElementById('vote-status').textContent = `Votes: ${data.totalVotes} / ${data.required}`;
    });

    socket.on('ejectionResult', (data) => {
      document.getElementById('discussion-screen').classList.add('hidden');
      document.getElementById('eject-screen').classList.remove('hidden');

      const ejectText = document.getElementById('eject-text');
      if (data.isImpostor) {
        ejectText.style.color = '#4ade80';
        ejectText.textContent = `🎉 ${data.ejectedName} WAS the Impostor! CREWMATES WIN!`;
      } else {
        ejectText.style.color = '#f87171';
        ejectText.textContent = `💀 ${data.ejectedName} was NOT the Impostor...`;
      }
    });

    socket.on('errorMsg', (msg) => alert(msg));
  </script>
</body>
</html>
