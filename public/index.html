<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WAR OF WORDS - DIEGO "THE CREATOR"</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #020617; color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; }

        #login-screen, #lobby-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #0f172a 0%, #000 100%); z-index: 50; }
        #lobby-screen { display: none; background: url('https://www.transparenttextures.com/patterns/cubes.png'), linear-gradient(135deg, #0f172a, #020617); }

        .box { background: rgba(15, 23, 42, 0.85); border: 2px solid #00f3ff; padding: 40px; border-radius: 15px; width: 450px; text-align: center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); backdrop-filter: blur(15px); }
        h1 { font-family: 'Orbitron', sans-serif; color: #00f3ff; font-size: 36px; text-shadow: 0 0 15px #00f3ff; }

        input, button { width: 100%; padding: 15px; margin-top: 15px; border-radius: 8px; border: none; font-family: 'Orbitron', sans-serif; font-size: 16px; }
        input { background: rgba(30, 41, 59, 0.8); color: #fff; border: 1px solid #475569; text-align: center; }
        button.btn-primary { background: linear-gradient(90deg, #0ea5e9, #00f3ff); color: #020617; font-weight: 900; cursor: pointer; }
        
        .lobby-container { display: flex; gap: 30px; width: 90%; max-width: 1200px; height: 80vh; }
        .panel { background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; flex: 1; }

        .class-card { background: #1e293b; border: 2px solid transparent; border-radius: 10px; padding: 15px; cursor: pointer; margin-bottom: 10px; text-align: center; }
        .class-card.creator { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }

        /* OVERLAY ULTI ERROR */
        #ult-overlay { display: none; position: absolute; inset: 0; background: rgba(0, 243, 255, 0.1); z-index: 80; pointer-events: none; justify-content: center; align-items: center; font-family: 'Orbitron'; font-size: 60px; color: #00f3ff; text-shadow: 0 0 30px #a855f7; }

        #game-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        #hud-player { position: absolute; bottom: 30px; left: 30px; background: rgba(2, 6, 23, 0.85); border-left: 5px solid #00f3ff; padding: 20px; border-radius: 10px; }
        .bar-container { width: 250px; height: 18px; background: #0f172a; border-radius: 9px; margin-top: 10px; border: 2px solid #334155; overflow: hidden; position: relative; }
        .fill { height: 100%; }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .scanlines { position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 99; opacity: 0.3; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="ult-overlay">SYSTEM ERROR: RECALCULATING...</div>

    <div id="login-screen">
        <div class="box">
            <h1>LAST WORD</h1>
            <p style="color: #64748b; margin-bottom: 20px;">ENGINE ARCHITECTURE</p>
            <input type="text" id="username" placeholder="CALLSIGN" autocomplete="off">
            <input type="password" id="secretKey" placeholder="KEY: admin123 OR diegox222013">
            <button class="btn-primary" onclick="connectToServer()">CONNECT</button>
        </div>
    </div>

    <div id="lobby-screen">
        <h1 style="margin-bottom: 20px;">LOBBY</h1>
        <div class="lobby-container">
            <div class="panel">
                <h2 style="font-family: 'Orbitron';">SELECT CLASS</h2>
                <div class="class-card creator" id="card-DIEGO" onclick="selectClass('DIEGO')">
                    <h3 style="color: #00f3ff; font-size: 24px;">DIEGO (THE CREATOR)</h3>
                    <p style="color: #94a3b8; font-size: 13px;">Trickster / Combat Engineer.<br>Glitch Field, Frame Perfect Combo, Break The Game Ulti.</p>
                </div>
            </div>
            <div class="panel" id="admin-panel" style="display:none; border-color: #ef4444;">
                <h2 style="font-family: 'Orbitron'; color: #ef4444;">OVERRIDE</h2>
                <button class="btn-primary" style="background: #ef4444; color: white; margin-top: 30px;" onclick="socket.emit('adminAction', {action: 'START_GAME'})">START GAME</button>
            </div>
        </div>
    </div>

    <div id="game-ui">
        <div id="hud-player">
            <h2 id="hud-name" style="font-family:'Orbitron';">OPERATOR</h2>
            <p id="hud-combo" style="color:#00f3ff; font-weight: bold;">COMBO TECH: x0 [STABLE]</p>
            <div class="bar-container">
                <div id="hp-fill" class="fill" style="background: #00f3ff; width: 100%;"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let myId = null;
        let gameState = { players: {}, bullets: [] };
        let currentMap = null;
        let camera = { x: 0, y: 0, shakeIntensity: 0 };
        const inputs = { left: false, right: false, upTrigger: false, aimAngle: 0, useDash: false, useUlt: false };

        let particles = [];
        let ghosts = [];

        function connectToServer() {
            socket.emit('joinLobby', {
                name: document.getElementById('username').value,
                adminKey: document.getElementById('secretKey').value
            });
        }

        socket.on('lobbyData', (data) => {
            myId = data.me.id;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            if(data.me.isAdmin) document.getElementById('admin-panel').style.display = 'flex';
        });

        socket.on('updateLobbyPlayers', (players) => {});

        socket.on('gameStarted', (data) => {
            currentMap = data.map;
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
        });

        socket.on('vfxEvent', (data) => {
            if(data.type === 'BREAK_THE_GAME') {
                const overlay = document.getElementById('ult-overlay');
                overlay.style.display = 'flex';
                camera.shakeIntensity = 30;
                setTimeout(() => { overlay.style.display = 'none'; }, 800);
            }
        });

        socket.on('stateUpdate', (data) => {
            gameState = data;
            let me = gameState.players[myId];
            if (me) {
                document.getElementById('hud-name').innerText = me.name;
                let auraState = me.auraLevel === 3 ? 'CORRUPTED' : (me.auraLevel === 2 ? 'OVERCLOCK' : 'STABLE');
                document.getElementById('hud-combo').innerText = `COMBO TECH: x${me.comboTech || 0} [${auraState}]`;
                document.getElementById('hp-fill').style.width = Math.max(0, (me.hp/me.maxHp)*100) + '%';
            }
        });

        window.addEventListener('keydown', e => { 
            if(e.code==='KeyA') inputs.left=true; 
            if(e.code==='KeyD') inputs.right=true; 
            if(e.code==='KeyW'||e.code==='Space') { inputs.upTrigger=true; socket.emit('playerInput', inputs); inputs.upTrigger=false; }
            if(e.code==='ShiftLeft') { inputs.useDash=true; socket.emit('playerInput', inputs); inputs.useDash=false; }
            if(e.code==='KeyQ') { inputs.useUlt=true; socket.emit('playerInput', inputs); inputs.useUlt=false; }
        });
        window.addEventListener('keyup', e => { if(e.code==='KeyA') inputs.left=false; if(e.code==='KeyD') inputs.right=false; });
        window.addEventListener('mousemove', e => { inputs.aimAngle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2); });
        window.addEventListener('mousedown', () => { if(currentMap) socket.emit('shoot'); });

        setInterval(() => { if(currentMap) socket.emit('playerInput', {left: inputs.left, right: inputs.right, aimAngle: inputs.aimAngle}); }, 1000/60);

        // ==========================================
        // 🖌️ RENDERIZADO VISUAL
        // ==========================================
        function draw() {
            requestAnimationFrame(draw);
            if (!currentMap) return;

            ctx.fillStyle = currentMap.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let me = gameState.players[myId];
            if (me) {
                camera.x += (me.x + me.w/2 - canvas.width/2 - camera.x) * 0.1;
                camera.y += (me.y + me.h/2 - canvas.height/2 - camera.y) * 0.1;
            }

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Dibujar Plataformas
            currentMap.platforms.forEach(p => {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#00f3ff'; ctx.fillRect(p.x, p.y, p.w, 4);
            });

            // Dibujar Jugadores
            Object.values(gameState.players).forEach(p => {
                if (p.hp <= 0) return;

                // === AURA GLITCH FIELD DE DIEGO ===
                if (p.charClass === 'DIEGO') {
                    const time = Date.now() * 0.008;
                    let primaryColor = p.auraLevel === 3 ? '#a855f7' : (p.auraLevel === 2 ? '#ffffff' : '#00f3ff');
                    
                    ctx.shadowColor = primaryColor;
                    ctx.shadowBlur = p.auraLevel * 10;

                    // Píxeles/Símbolos Flotantes alrededor
                    for(let i=0; i<p.auraLevel*3; i++) {
                        let px = p.x + Math.sin(time + i)*30;
                        let py = p.y + Math.cos(time + i)*30;
                        ctx.fillStyle = Math.random() > 0.5 ? '#00f3ff' : '#a855f7';
                        ctx.fillRect(px, py, 4, 4);
                    }
                }

                // Render Personaje (Chaqueta Oscura + Gafas Brillantess)
                ctx.fillStyle = '#0f172a'; // Chaqueta muy oscura
                ctx.fillRect(p.x, p.y, p.w, p.h);

                // Gafas Cyan Brillantes
                ctx.fillStyle = p.charClass === 'DIEGO' ? '#00f3ff' : '#fff';
                let aimX = Math.cos(p.aimAngle)*4;
                let aimY = Math.sin(p.aimAngle)*4;
                ctx.fillRect(p.x + 6 + aimX, p.y + 10 + aimY, 20, 6);

                ctx.shadowBlur = 0;
            });

            // Dibujar Proyectiles BYTE BLASTER
            gameState.bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color; ctx.shadowBlur = 10;
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size); // Píxeles cuadrados
            });
            ctx.shadowBlur = 0;

            ctx.restore();
        }
        draw();
    </script>
</body>
</html>
