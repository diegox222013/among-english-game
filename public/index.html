<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ULTRA BUFFED ARENA - DIEGOX222013 vs PROFE</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Impact', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        #login-screen { position: absolute; inset: 0; background: radial-gradient(circle, #1e1b4b, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        input, button { padding: 15px 25px; font-size: 22px; margin: 10px; border-radius: 8px; border: none; font-family: inherit; }
        input { background: #0f172a; color: #22c55e; border: 2px solid #22c55e; text-align: center; }
        button { background: #ef4444; color: #fff; cursor: pointer; text-shadow: 0 0 10px #000; box-shadow: 0 0 20px #ef4444; }
        button:hover { transform: scale(1.1); }
        canvas { background: #020617; display: block; }
        #hud { position: absolute; top: 15px; left: 15px; pointer-events: none; font-size: 18px; text-align: left; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 2px solid #38bdf8; text-shadow: 0 0 5px #38bdf8; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div id="login-screen">
    <h1 style="font-size: 3rem; color: #f59e0b; text-shadow: 0 0 20px #f59e0b;">🔥 ULTRA GOD-MODE ARENA 🔥</h1>
    <input type="text" id="username" placeholder="PON TU NOMBRE..." maxlength="15">
    <button onclick="login()">¡ENTRAR AL CAOS!</button>
</div>

<div id="hud">Cargando Modo Dios...</div>
<canvas id="gameCanvas"></canvas>

<script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let myId = null;
    let gameState = { players: {}, bullets: [] };
    const inputs = { left: false, right: false, up: false };
    let mouse = { x: 0, y: 0 };

    function login() {
        const name = document.getElementById('username').value;
        if (name) {
            socket.emit('joinGame', name);
            document.getElementById('login-screen').style.display = 'none';
        }
    }

    socket.on('registered', data => myId = data.id);
    socket.on('stateUpdate', data => gameState = data);

    window.addEventListener('keydown', e => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = true;
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = false;
    });

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    window.addEventListener('mousedown', e => {
        let me = gameState.players[myId];
        if (!me) return;

        let camX = me.x - canvas.width / 2;
        let camY = me.y - canvas.height / 2;
        let worldMouseX = mouse.x + camX;
        let worldMouseY = mouse.y + camY;

        if (e.button === 0) {
            let angle = Math.atan2(worldMouseY - me.y, worldMouseX - me.x);
            socket.emit('shoot', angle);
        } else if (e.button === 2) {
            socket.emit('useAbility', { x: worldMouseX, y: worldMouseY });
        }
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    setInterval(() => socket.emit('playerInput', inputs), 1000 / 60);

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let me = gameState.players[myId];
        let camX = me ? me.x - canvas.width / 2 : 0;
        let camY = me ? me.y - canvas.height / 2 : 0;

        ctx.save();
        ctx.translate(-camX, -camY);

        // Borde Cyber del Mapa
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, 2880, 1000);

        // Suelo Lava/Cyber
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(0, 960, 2880, 40);

        // Renderizar Jugadores
        Object.values(gameState.players).forEach(p => {
            if (p.hp <= 0) return;

            // Aura por Clase
            ctx.shadowBlur = 30;
            ctx.shadowColor = p.classType === 'NINJA' ? '#00f0ff' : (p.classType === 'PROFE' ? '#a855f7' : '#22c55e');

            ctx.fillStyle = p.classType === 'NINJA' ? '#38bdf8' : (p.classType === 'PROFE' ? '#a855f7' : '#22c55e');
            ctx.fillRect(p.x - 15, p.y - 30, 30, 50);

            // Barra de vida gigante
            ctx.fillStyle = '#111';
            ctx.fillRect(p.x - 40, p.y - 50, 80, 10);
            ctx.fillStyle = ctx.shadowColor;
            ctx.fillRect(p.x - 40, p.y - 50, (p.hp / p.maxHp) * 80, 10);

            // Nombres
            ctx.fillStyle = '#fff';
            ctx.font = '16px Impact';
            ctx.fillText(`${p.name} [${p.classType}]`, p.x - 35, p.y - 60);
        });

        // Balas / Rayos
        gameState.bullets.forEach(b => {
            ctx.shadowBlur = 15;
            if (b.isLaser) {
                ctx.shadowColor = '#00f0ff';
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(b.x - 5, b.y - 5, 12, 12);
            } else if (b.isNuke) {
                ctx.shadowColor = '#a855f7';
                ctx.fillStyle = '#c084fc';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 25, 0, Math.PI*2); // Proyectil gigante
                ctx.fill();
            } else {
                ctx.shadowColor = '#f59e0b';
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(b.x, b.y, 10, 10);
            }
        });

        ctx.restore();

        // HUD Local
        if (me) {
            document.getElementById('hud').innerHTML = 
                `<b style="color:#f59e0b;">GOD-PLAYER:</b> ${me.name}<br>` +
                `<b style="color:#38bdf8;">ROL:</b> ${me.classType}<br>` +
                `<b style="color:#22c55e;">VIDA:</b> ${me.hp} / ${me.maxHp}<br>` +
                `<b style="color:#ef4444;">SKILL [CLIC DER]:</b> ${me.abilityCD === 0 ? '⚡¡LISTA!⚡' : Math.ceil(me.abilityCD/60)+'s'}`;
        }

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
