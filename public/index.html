<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nature Arena - Minigames & Special Roles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #020617; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        #config-screen { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(2, 6, 23, 0.95); z-index: 30; }
        .card { background: #0f172a; border-radius: 16px; padding: 25px; width: 350px; border: 2px solid #34d399; text-align: center; }
        input, select, button { padding: 10px; margin-top: 10px; width: 100%; border-radius: 8px; border: none; font-weight: bold; }
        input, select { background: #1e293b; color: white; }
        button { background: #34d399; color: #020617; cursor: pointer; }

        #hud { position: absolute; top: 15px; left: 15px; background: rgba(15,23,42,0.8); padding: 12px; border-radius: 10px; display: none; }
        #mission-hud { position: absolute; top: 15px; right: 15px; background: rgba(30, 27, 75, 0.9); border: 2px solid #818cf8; padding: 12px; border-radius: 10px; display: none; }
        canvas { display: none; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="config-screen">
        <div class="card">
            <h2 style="color:#34d399;">NATURE ARENA</h2>
            <p style="font-size:12px; color:#a7f3d0; margin-top:5px;">Nombres especiales: <b>profe</b>, <b>ninja</b>, <b>wolfcute</b></p>
            <input type="text" id="username" placeholder="Tu Nickname">
            <select id="mode-select" onchange="socket.emit('selectMode', this.value)">
                <option value="PVP">⚔️ Modo PvP (Todos contra todos)</option>
                <option value="MINIGAME">🔤 Minijuego Co-op (Spell Word)</option>
            </select>
            <button onclick="startGame()">ENTRAR</button>
        </div>
    </div>

    <div id="hud"><div id="player-info"></div></div>
    <div id="mission-hud">
        <h4 style="color:#818cf8">📜 MINIJUEGO: SPELL THE WORD</h4>
        <p>Palabra: <b id="word-display" style="color:#fcd34d">ENG_ISH</b></p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let myId = null, platforms = [], portal = {}, gameState = {};
        const inputs = { left: false, right: false, up: false, aimAngle: 0 };

        function startGame() {
            socket.emit('joinGame', { name: document.getElementById('username').value });
            document.getElementById('config-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            canvas.style.display = 'block';
        }

        socket.on('registered', d => { myId = d.id; platforms = d.platforms; portal = d.portal; });
        socket.on('stateUpdate', d => {
            gameState = d;
            document.getElementById('mission-hud').style.display = d.gameMode === 'MINIGAME' ? 'block' : 'none';
            if(d.mission) document.getElementById('word-display').innerText = d.mission.currentWord;
        });

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyA') inputs.left = true;
            if (e.code === 'KeyD') inputs.right = true;
            if (e.code === 'KeyW') inputs.up = true;
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA') inputs.left = false;
            if (e.code === 'KeyD') inputs.right = false;
            if (e.code === 'KeyW') inputs.up = false;
        });
        window.addEventListener('mousemove', e => {
            let me = (gameState.players || {})[myId];
            if (me) inputs.aimAngle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
        });
        window.addEventListener('mousedown', e => {
            if (e.button === 0) socket.emit('shoot');
            if (e.button === 2) socket.emit('useAbilityTrigger', { targetPoint: true });
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        setInterval(() => socket.emit('playerInput', inputs), 1000/60);

        function draw() {
            requestAnimationFrame(draw);
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            let me = (gameState.players || {})[myId];
            let camX = me ? me.x - canvas.width/2 : 0;
            let camY = me ? me.y - canvas.height/2 : 0;

            ctx.save(); ctx.translate(-camX, -camY);

            // Plataformas
            platforms.forEach(p => {
                ctx.fillStyle = p.type === 'lobby_floor' ? '#312e81' : '#064e3b';
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Portal
            if (portal.x) {
                ctx.fillStyle = '#34d399'; ctx.fillRect(portal.x, portal.y, portal.w, portal.h);
            }

            // Partículas de Aura Especiales
            (gameState.auraParticles || []).forEach(p => {
                if (p.type === 'text') {
                    ctx.fillStyle = '#38bdf8'; ctx.font = "bold 14px 'Segoe UI'";
                    ctx.fillText(p.text, p.x, p.y);
                } else if (p.type === 'ninja') {
                    ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
            });

            // Letras del Minijuego
            (gameState.missionItems || []).forEach(item => {
                ctx.fillStyle = '#fbbf24'; ctx.fillRect(item.x, item.y, item.w, item.h);
                ctx.fillStyle = '#000'; ctx.font = "bold 20px 'Segoe UI'";
                ctx.fillText(item.text, item.x + 12, item.y + 28);
            });

            // Jugadores
            Object.values(gameState.players || {}).forEach(p => {
                if (p.hp > 0) {
                    ctx.fillStyle = p.isNinja ? '#a855f7' : (p.isWolfcute ? '#ec4899' : (p.isProfe ? '#38bdf8' : '#10b981'));
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#fff'; ctx.font = "12px 'Segoe UI'";
                    ctx.fillText(p.name, p.x, p.y - 8);
                }
            });

            // Balas
            (gameState.bullets || []).forEach(b => {
                ctx.fillStyle = b.isShuriken ? '#a855f7' : (b.isBook ? '#38bdf8' : '#ef4444');
                ctx.fillRect(b.x-4, b.y-4, 8, 8);
            });

            ctx.restore();
            if (me) document.getElementById('player-info').innerText = `${me.name} | Vida: ${me.hp}`;
        }
        draw();
    </script>
</body>
</html>
