<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NINJA ARENA 2D - MAPA COMPLETO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        
        #login-screen {
            position: absolute; inset: 0; background: #070a12;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .login-box {
            background: #0f172a; border: 2px solid #38bdf8; padding: 30px; border-radius: 12px;
            text-align: center; box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); width: 320px;
        }
        input, button { padding: 12px; font-size: 16px; margin-top: 12px; border-radius: 6px; border: none; font-weight: bold; width: 100%; }
        input { background: #1e293b; color: #fff; border: 1px solid #475569; text-align: center; }
        button { background: #22c55e; color: #fff; cursor: pointer; }
        button:hover { background: #16a34a; }

        canvas { display: block; background: #0b1120; }
        
        #hud {
            position: absolute; top: 15px; left: 15px; pointer-events: none;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
            padding: 12px; border-radius: 8px; font-size: 14px;
        }
        .hp-bar { background: #334155; height: 12px; width: 200px; border-radius: 6px; margin-top: 5px; overflow: hidden; }
        .hp-fill { background: #22c55e; height: 100%; transition: width 0.1s; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color: #38bdf8;">ARENA PLATAFORMAS</h2>
        <p style="color: #94a3b8; font-size: 12px; margin-top: 5px;">Ninja (diegox222013) | Profe (profe)</p>
        <input type="text" id="username" placeholder="Tu Nombre..." maxlength="15">
        <button onclick="login()">¡JUGAR!</button>
    </div>
</div>

<div id="hud">
    <div id="player-info">Cargando...</div>
    <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let myId = null;
    let platforms = [];
    let gameState = { players: {}, bullets: [] };
    const inputs = { left: false, right: false, up: false, aimAngle: 0 };
    let mouse = { x: 0, y: 0 };

    function login() {
        const name = document.getElementById('username').value;
        if (name) {
            socket.emit('joinGame', name);
            document.getElementById('login-screen').style.display = 'none';
        }
    }

    socket.on('registered', data => {
        myId = data.id;
        platforms = data.platforms;
    });

    socket.on('stateUpdate', data => gameState = data);

    window.addEventListener('keydown', e => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = true;
        if (e.code === 'KeyW' || e.code === 'Space') inputs.up = true;
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = false;
        if (e.code === 'KeyW' || e.code === 'Space') inputs.up = false;
    });

    window.addEventListener('mousemove', e => { 
        mouse.x = e.clientX; 
        mouse.y = e.clientY; 
    });

    window.addEventListener('mousedown', e => {
        let me = gameState.players[myId];
        if (!me) return;

        let camX = me.x - canvas.width / 2;
        let camY = me.y - canvas.height / 2;
        let worldMouseX = mouse.x + camX;
        let worldMouseY = mouse.y + camY;

        let angle = Math.atan2(worldMouseY - (me.y + me.h/3), worldMouseX - (me.x + me.w/2));

        if (e.button === 0) {
            socket.emit('shoot', angle);
        } else if (e.button === 2) {
            socket.emit('useAbility', { x: worldMouseX, y: worldMouseY });
        }
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    // Enviar ángulo de apuntado continuo al servidor
    setInterval(() => {
        let me = gameState.players[myId];
        if (me) {
            let camX = me.x - canvas.width / 2;
            let camY = me.y - canvas.height / 2;
            inputs.aimAngle = Math.atan2((mouse.y + camY) - (me.y + me.h/3), (mouse.x + camX) - (me.x + me.w/2));
        }
        socket.emit('playerInput', inputs);
    }, 1000 / 60);

    // Dibujar personaje detallado
    function drawAvatar(p) {
        let centerX = p.x + p.w / 2;
        let centerY = p.y + p.h / 2;

        // Cuerda de Gancho Grapple (Si se usó)
        if (p.grapple) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, p.y + 10);
            ctx.lineTo(p.grapple.x, p.grapple.y);
            ctx.stroke();
        }

        // 1. Cuerpo (Traje/Ropa)
        ctx.fillStyle = p.classType === 'NINJA' ? '#0284c7' : (p.classType === 'PROFE' ? '#7e22ce' : '#15803d');
        ctx.fillRect(p.x + 4, p.y + 18, 24, 26);

        // 2. Cabeza
        ctx.fillStyle = p.classType === 'NINJA' ? '#0f172a' : '#fbcfe8'; // Ninja usa máscara negra
        ctx.beginPath();
        ctx.arc(centerX, p.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();

        // Cinta Ninja / Lentes Profe
        if (p.classType === 'NINJA') {
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(p.x + 4, p.y + 8, 24, 5); // Cinta
        } else if (p.classType === 'PROFE') {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(centerX - 9, p.y + 8, 8, 6); // Lentes
            ctx.strokeRect(centerX + 1, p.y + 8, 8, 6);
        }

        // 3. Ojos Interactivos (Siguen el ángulo donde apunta)
        let eyeDist = 4;
        let eyeX = Math.cos(p.aimAngle) * eyeDist;
        let eyeY = Math.sin(p.aimAngle) * eyeDist;

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(centerX - 4 + eyeX, p.y + 11 + eyeY, 3, 0, Math.PI * 2);
        ctx.arc(centerX + 4 + eyeX, p.y + 11 + eyeY, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(centerX - 4 + eyeX, p.y + 11 + eyeY, 1.5, 0, Math.PI * 2);
        ctx.arc(centerX + 4 + eyeX, p.y + 11 + eyeY, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // 4. Armas Visibles
        ctx.save();
        ctx.translate(centerX, p.y + 24);
        ctx.rotate(p.aimAngle);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(5, -3, 16, 6); // Cañón del arma
        ctx.restore();

        // 5. Nombre y Barra de Vida encima del personaje
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, centerX, p.y - 18);

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(p.x - 4, p.y - 12, 40, 6);
        ctx.fillStyle = p.hp > 30 ? '#22c55e' : '#ef4444';
        ctx.fillRect(p.x - 4, p.y - 12, (p.hp / p.maxHp) * 40, 6);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let me = gameState.players[myId];
        let camX = me ? me.x - canvas.width / 2 : 0;
        let camY = me ? me.y - canvas.height / 2 : 0;

        ctx.save();
        ctx.translate(-camX, -camY);

        // Renderizar Escenario / Plataformas
        platforms.forEach(plat => {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        });

        // Jugadores
        Object.values(gameState.players).forEach(p => {
            if (p.hp > 0) drawAvatar(p);
        });

        // Balas
        gameState.bullets.forEach(b => {
            ctx.fillStyle = b.type === 'NINJA' ? '#38bdf8' : (b.type === 'PROFE' ? '#c084fc' : '#f59e0b');
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();

        // HUD
        if (me) {
            document.getElementById('player-info').innerHTML = 
                `<b>${me.name}</b> [${me.classType}] | Bajas: ${me.score}<br>` +
                `<span style="color:#94a3b8;">Habilidad (Clic Der):</span> ${me.abilityCD === 0 ? '<b style="color:#22c55e;">¡READY!</b>' : Math.ceil(me.abilityCD/60)+'s'}`;
            
            document.getElementById('hp-fill').style.width = (me.hp / me.maxHp * 100) + '%';
        }

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
