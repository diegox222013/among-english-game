<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LAST WORD: WAR OF WORDS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #020617; color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; }

        #login-screen { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #0f172a 0%, #020617 100%); z-index: 50; }
        .box { background: rgba(15, 23, 42, 0.8); border: 2px solid #38bdf8; padding: 40px; border-radius: 15px; width: 420px; text-align: center; box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); backdrop-filter: blur(10px); }
        .box h1 { font-family: 'Orbitron', sans-serif; color: #38bdf8; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 10px #38bdf8; }
        .box p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-family: 'Orbitron', sans-serif; outline: none; }
        input { background: #1e293b; color: #fff; border: 1px solid #334155; }
        button { background: #38bdf8; color: #020617; font-weight: 900; cursor: pointer; transition: 0.2s; }
        button:hover { background: #7dd3fc; transform: scale(1.02); }

        /* HUD TÁCTICO EN TIEMPO REAL */
        #intel-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; padding: 12px 30px; border-radius: 30px; font-family: 'Orbitron', sans-serif; font-size: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.8); display: none; z-index: 10; }
        
        #hud-player { position: absolute; bottom: 20px; left: 20px; background: rgba(2, 6, 23, 0.8); border-left: 4px solid #38bdf8; padding: 15px 20px; border-radius: 8px; display: none; }
        .bar { width: 180px; height: 10px; background: #1e293b; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .fill { height: 100%; background: #38bdf8; transition: 0.2s; }
        canvas { display: block; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="login-screen">
        <div class="box">
            <h1>LAST WORD</h1>
            <p>WAR OF WORDS — COMPETITIVE 2D</p>
            <input type="text" id="username" placeholder="OPERATOR NICKNAME">
            <input type="password" id="secretKey" placeholder="SECRET ACCESS CODE (OPTIONAL)">
            <button onclick="enterArena()">DEPLOY TO ARENA</button>
        </div>
    </div>

    <div id="intel-banner"><span id="intel-text">📡 CONNECTING TO TACTICAL FREQUENCY...</span></div>

    <div id="hud-player">
        <h3 id="hud-name" style="font-family:'Orbitron';">OPERATOR</h3>
        <p id="hud-role" style="color:#38bdf8; font-size:12px;">ROOKIE</p>
        <div class="bar"><div id="hp-fill" class="fill"></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let myId = null, gameState = {}, camera = { x: 0, y: 0 };
        const inputs = { left: false, right: false, up: false, aimAngle: 0 };

        function enterArena() {
            socket.emit('joinGame', {
                name: document.getElementById('username').value,
                adminKey: document.getElementById('secretKey').value
            });
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('intel-banner').style.display = 'block';
            document.getElementById('hud-player').style.display = 'block';
        }

        socket.on('registered', d => { myId = d.id; });
        socket.on('stateUpdate', d => {
            gameState = d;
            let me = d.players[myId];
            if (me) {
                document.getElementById('hud-name').innerText = me.name;
                document.getElementById('hud-role').innerText = me.pRole;
                document.getElementById('hud-role').style.color = me.color;
                document.getElementById('hp-fill').style.width = Math.max(0, (me.hp / me.maxHp)*100) + '%';

                // Mostrar la Intel Asimétrica Táctica
                if (d.notices && d.notices[myId]) {
                    const banner = document.getElementById('intel-text');
                    banner.innerText = d.notices[myId].text;
                    banner.style.color = d.notices[myId].color;
                }
            }
        });

        window.addEventListener('keydown', e => { if(e.code==='KeyA') inputs.left=true; if(e.code==='KeyD') inputs.right=true; if(e.code==='KeyW'||e.code==='Space') inputs.up=true; });
        window.addEventListener('keyup', e => { if(e.code==='KeyA') inputs.left=false; if(e.code==='KeyD') inputs.right=false; if(e.code==='KeyW'||e.code==='Space') inputs.up=false; });
        window.addEventListener('mousemove', e => { if(gameState.players && gameState.players[myId]) inputs.aimAngle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2); });
        window.addEventListener('mousedown', e => { if(e.button===0) socket.emit('shoot'); if(e.button===2) socket.emit('useAbilityTrigger'); });
        window.addEventListener('contextmenu', e => e.preventDefault());

        setInterval(() => socket.emit('playerInput', inputs), 1000/60);

        function draw() {
            requestAnimationFrame(draw);
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            let me = (gameState.players || {})[myId];
            if (me) {
                camera.x += (me.x + me.w/2 - canvas.width/2 - camera.x) * 0.1;
                camera.y += (me.y + me.h/2 - canvas.height/2 - camera.y) * 0.1;
            }

            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Dibujar Plataformas Dinámicas
            (gameState.platforms || []).forEach(p => {
                if (p.active) {
                    ctx.fillStyle = p.type === 'bridge' ? '#f59e0b' : '#1e293b';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            });

            // Dibujar Operadores / Jugadores
            Object.values(gameState.players || {}).forEach(p => {
                if (p.hp > 0) {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);

                    // Indicador de Cargas de Ninja (Si es Ninja)
                    if (p.isNinja) {
                        ctx.fillStyle = '#a855f7';
                        for(let i=0; i<p.dashCharges; i++) {
                            ctx.beginPath(); ctx.arc(p.x + (i*10) + 8, p.y - 10, 3, 0, Math.PI*2); ctx.fill();
                        }
                    }

                    ctx.fillStyle = '#fff'; ctx.font = "12px 'Orbitron'"; ctx.textAlign="center";
                    ctx.fillText(p.name, p.x + p.w/2, p.y - 18);
                }
            });

            // Proyectiles Tácticos
            (gameState.bullets || []).forEach(b => {
                ctx.fillStyle = b.type === 'drop' ? '#f59e0b' : '#38bdf8';
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            });

            ctx.restore();
        }
        draw();
    </script>
</body>
</html>
